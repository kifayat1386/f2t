services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: khamarbari
      POSTGRES_USER: khamar
      POSTGRES_PASSWORD: khamar_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khamar -d khamarbari"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: khamar_minio
      MINIO_ROOT_PASSWORD: khamar_minio_secret
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/config/node_modules
      - /app/packages/i18n/node_modules
      - /app/packages/sdk/node_modules
      - /app/packages/services/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: >
      sh -c "pnpm install && pnpm run --filter @kb/api dev"
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.dev
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/config/node_modules
      - /app/packages/i18n/node_modules
      - /app/packages/sdk/node_modules
      - /app/packages/services/node_modules
      - /app/packages/types/node_modules
      - /app/packages/ui/node_modules
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    command: >
      sh -c "pnpm install && pnpm run --filter @kb/web dev"
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
